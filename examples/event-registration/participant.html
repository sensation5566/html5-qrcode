<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Participant Check-ins</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 1em; text-align: center; }
        #qr-reader { width: 100%; max-width: 400px; margin: 0 auto; }
        #info { margin-top: 20px; font-weight: bold; }
        #list { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Participant Portal</h1>
    <div id="qr-reader"></div>
    <div id="info"></div>
    <div id="list"></div>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
    const TOTAL_STORES = 47;

    async function getCheckins(id) {
        const res = await fetch(`/participant/${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error('Server error');
        const data = await res.json();
        return data.visits || new Array(TOTAL_STORES).fill(false);
    }

    function setInfo(msg) {
        document.getElementById('info').textContent = msg;
    }

    function setList(stores) {
        document.getElementById('list').textContent =
            stores.length ? `\u5df2\u8a2a\u554f\u5e97\u5bb6\uff1a${stores.join(', ')}` : '';
    }

    async function onScanSuccess(decodedText) {
        try {
            const visits = await getCheckins(decodedText);
            const count = visits.filter(v => v).length;
            setInfo(`Visited ${count} store(s)`);
            const stores = visits.map((v, i) => v ? i + 1 : null).filter(v => v);
            setList(stores);
        } catch (e) {
            setInfo('Server error');
            setList([]);
        }
    }

    const html5QrCode = new Html5Qrcode('qr-reader');
    const config = { fps: 10, qrbox: 250 };

    html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess)
      .catch(err => {
        console.warn('Falling back to default camera', err);
        html5QrCode.start({ facingMode: 'user' }, config, onScanSuccess)
          .catch(err2 => console.error(err2));
      });
    </script>
</body>
</html>
