<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2025條通祭：微醺散步兌換進度</title>
    <style>
        html, body { width:100%; height:100%; margin:0; padding:0; }
        body {
            display:flex;
            justify-content:center;
            align-items:flex-start;
            padding-top:15vh;
            background-color:#333;
            background-image:url('img/bg.png');
            background-repeat:no-repeat;
            background-position:top center;
            background-size:auto 100%;
            font-family:sans-serif;
            color:#fff;
        }
        @media (max-width: 999px) {
            body {
                background-size:100% auto;
                background-position:center 15%;
                overflow:hidden;
            }
        }
        #main {
            width:100%;
            max-width:400px;
            text-align:center;
        }
        #img-wrapper {
            position:relative;
            text-align:center;
        }
        #img-wrapper img {
            width:70%;
            display:block;
            margin:0 auto;
        }
        #participant-input {
            position:absolute;
            left:10%;
            top:35%;
            width:50%;
            background:transparent;
            border:none;
            font-size:1.1em;
            text-align:center;
            color:#000;
            outline:none;
        }
        #submit-area {
            position:absolute;
            top:0;
            right:12%;
            width:25%;
            height:100%;
            cursor:pointer;
        }
        #info {
            margin-top:20px;
            font-weight:bold;
            min-height:1.5em;
        }
        #list {
            margin-top:10px;
            height:12em;
            max-height:12em;
            overflow-y:auto;
            visibility:hidden;
        }
        #prompt {
            margin-bottom:10px;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="prompt">請輸入您的ID</div>
        <div id="img-wrapper">
            <img src="img/store_id.png" alt="Participant ID">
            <input id="participant-input" type="text" pattern="[A-Za-z0-9]*" maxlength="20" />
            <div id="submit-area"></div>
        </div>
        <div id="info"></div>
        <div id="list"></div>
    </div>
    <script>
    const TOTAL_STORES = 47;
    let STORE_NAMES = [];
    let PARTICIPANTS = [];

    async function loadParticipants() {
        const res = await fetch('participants.txt');
        const text = await res.text();
        PARTICIPANTS = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
    }

    async function loadStoreNames() {
        const res = await fetch('store_table.txt');
        const text = await res.text();
        const obj = Function('return ' + text)();
        STORE_NAMES = Object.keys(obj);
    }

    async function getCheckins(id) {
        const res = await fetch(`/participant/${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error('Server error');
        const data = await res.json();
        return data.visits || new Array(TOTAL_STORES).fill(false);
    }

    async function hasCheckedIn(id) {
        try {
            const res = await fetch('/checkin.log', { cache: 'no-store' });
            if (!res.ok) return false;
            const text = await res.text();
            return text.split('\n').some(line => line.trim() === id);
        } catch (e) {
            return false;
        }
    }

    function setInfo(msg) {
        document.getElementById('info').textContent = msg;
    }

    function setList(names) {
        const list = document.getElementById('list');
        list.innerHTML = names.join('<br>');
        list.style.visibility = names.length ? 'visible' : 'hidden';
    }

    Promise.all([loadStoreNames(), loadParticipants()]).then(() => {
        document.getElementById('submit-area').addEventListener('click', async () => {
            const val = document.getElementById('participant-input').value.trim();
            if (!PARTICIPANTS.includes(val)) {
                setInfo('Invalid ID');
                setList([]);
                return;
            }
            if (!await hasCheckedIn(val)) {
                setInfo('您尚未報到，請至報到處完成');
                setList([]);
                return;
            }
            try {
                const visits = await getCheckins(val);
                const names = STORE_NAMES.filter((_, i) => visits[i]);
                setInfo(`已於 ${names.length} 間店兌換：`);
                setList(names);
            } catch (e) {
                setInfo('Server error');
                setList([]);
            }
        });
    });
    </script>
</body>
</html>
