<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Participant Portal</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
            background-image: url('img/bg.png');
            background-repeat: no-repeat;
            background-position: top center;
            background-size: auto 100%;
        }
        @media (max-width: 999px) {
            body {
                background-size: 100% auto;
                background-position: center 15%;
                overflow: hidden;
            }
        }
        #main-container {
            width: 100%;
            max-width: 400px;
            padding: 1em;
            box-sizing: border-box;
            text-align: center;
            color: #fff;
        }
        #camera-wrapper {
            position: relative;
            width: 80%;
            background: url('img/camera.png') no-repeat center center;
            margin: 0 auto;
            background-size: 76% 97%;
            margin: 0 auto;
            padding-top: 10%;
            padding-right: 3%;
            padding-bottom: 3%;
        }
        #qr-reader {
            width: 70%;
            margin: auto;
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }
        #qr-reader video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
        }
        h1 {
            color: #ffffff;
        }
        #info {
            margin-top: 20px;
            font-weight: bold;
        }
        #list {
            margin-top: 10px;
            max-height: 6em;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <p></p>
        <h1 style="padding-top: 1.5em;">Participant Portal</h1>
        <div id="camera-wrapper">
            <div id="qr-reader"></div>
        </div>
        <div id="info"></div>
        <div id="list"></div>
    </div>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
    const TOTAL_STORES = 47;
    let STORE_NAMES = [];

    async function loadStoreNames() {
        const res = await fetch('store_table.txt');
        const text = await res.text();
        const obj = Function('return ' + text)();
        STORE_NAMES = Object.keys(obj);
    }

    async function getCheckins(id) {
        const res = await fetch(`/participant/${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error('Server error');
        const data = await res.json();
        return data.visits || new Array(TOTAL_STORES).fill(false);
    }

    function setInfo(msg) {
        document.getElementById('info').textContent = msg;
    }

    function setList(names) {
        const listEl = document.getElementById('list');
        listEl.innerHTML = names.join('<br>');
    }

    async function onScanSuccess(decodedText) {
        try {
            const visits = await getCheckins(decodedText);
            const count = visits.filter(v => v).length;
            setInfo(`Visited ${count} store(s)`);
            const names = STORE_NAMES.filter((_, i) => visits[i]);
            setList(names);
        } catch (e) {
            setInfo('Server error');
            setList([]);
        }
    }

    const html5QrCode = new Html5Qrcode('qr-reader');
    const config = { fps: 10, qrbox: 200, aspectRatio: 1.0 };

    loadStoreNames().then(() => {
        html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess)
          .catch(err => {
            console.warn('Falling back to default camera', err);
            html5QrCode.start({ facingMode: 'user' }, config, onScanSuccess)
              .catch(err2 => console.error(err2));
          });
    });
    </script>
</body>
</html>
