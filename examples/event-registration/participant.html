<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Participant Check-ins</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 1em; text-align: center; }
        #qr-reader { width: 100%; max-width: 400px; margin: 0 auto; }
        #info { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Participant Portal</h1>
    <div id="qr-reader"></div>
    <div id="info"></div>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
    function getCheckins(id) {
        const checkins = JSON.parse(localStorage.getItem('checkins') || '{}');
        return checkins[id] || [];
    }

    function setInfo(msg) {
        document.getElementById('info').textContent = msg;
    }

    function onScanSuccess(decodedText) {
        const visits = getCheckins(decodedText);
        setInfo(`Visited ${visits.length} store(s)`);
    }

    const scanner = new Html5QrcodeScanner('qr-reader', { fps: 10, qrbox: 250 });
    scanner.render(onScanSuccess);
    </script>
</body>
</html>
