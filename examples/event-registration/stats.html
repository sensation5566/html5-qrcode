<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Check-in Summary</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 1em; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 4px; text-align: left; }
        th { background: #eee; }
    </style>
</head>
<body>
    <h1>Check-in Summary</h1>
    <table id="summary-table">
        <thead>
            <tr><th>Store</th><th>Check-ins</th><th>Participants</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
    const TOTAL_STORES = 56;

    function loadTotals() {
        const checkins = JSON.parse(localStorage.getItem('checkins') || '{}');
        const totals = new Array(TOTAL_STORES).fill(0);
        const lists = Array.from({length: TOTAL_STORES}, () => []);
        for (const id in checkins) {
            const visits = checkins[id];
            visits.forEach((v, i) => {
                if (v) {
                    totals[i]++;
                    lists[i].push(id);
                }
            });
        }
        return {totals, lists};
    }

    function populateTable() {
        const tbody = document.querySelector('#summary-table tbody');
        const {totals, lists} = loadTotals();
        tbody.innerHTML = '';
        for (let i = 0; i < TOTAL_STORES; i++) {
            const tr = document.createElement('tr');
            const storeCell = document.createElement('td');
            storeCell.textContent = `Store ${i + 1}`;
            const countCell = document.createElement('td');
            countCell.textContent = totals[i];
            const listCell = document.createElement('td');
            listCell.textContent = lists[i].join(', ');
            tr.appendChild(storeCell);
            tr.appendChild(countCell);
            tr.appendChild(listCell);
            tbody.appendChild(tr);
        }
    }

    populateTable();
    </script>
</body>
</html>
