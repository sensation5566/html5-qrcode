<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Check-in Summary</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 1em; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 4px; text-align: left; }
        th { background: #eee; }
    </style>
</head>
<body>
    <h1>Check-in Summary</h1>
    <table id="summary-table">
        <thead>
            <tr><th>#</th><th>Store</th><th>Check-ins</th><th>Participants</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
    async function loadTotals() {
        const res = await fetch('/stats');
        if (!res.ok) throw new Error('Server error');
        return res.json();
    }

    async function loadStoreNames() {
        const res = await fetch('store_table.txt');
        const text = await res.text();
        const obj = Function('return ' + text)();
        return Object.keys(obj);
    }

    async function populateTable() {
        const tbody = document.querySelector('#summary-table tbody');
        const [names, { totals, lists }] = await Promise.all([
            loadStoreNames(),
            loadTotals()
        ]);
        tbody.innerHTML = '';
        for (let i = 0; i < names.length; i++) {
            const tr = document.createElement('tr');
            const numCell = document.createElement('td');
            numCell.textContent = i + 1;
            const storeCell = document.createElement('td');
            storeCell.textContent = names[i];
            const countCell = document.createElement('td');
            countCell.textContent = totals[i];
            const listCell = document.createElement('td');
            listCell.textContent = lists[i].join(', ');
            tr.appendChild(numCell);
            tr.appendChild(storeCell);
            tr.appendChild(countCell);
            tr.appendChild(listCell);
            tbody.appendChild(tr);
        }
    }

    populateTable();
    </script>
</body>
</html>
