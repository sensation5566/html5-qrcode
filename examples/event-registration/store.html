<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store Check-in</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
            background-image: url('img/bg.png');
            background-repeat: no-repeat;
            background-position: top center;
            background-size: auto 100%;
        }
        #main-container {
            width: 100%;
            max-width: 400px;
            padding: 1em;
            box-sizing: border-box;
            text-align: center;
        }
        #camera-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1127 / 1200;
            background: url('img/camera.png') no-repeat center center;
            background-size: contain;
            margin: 0 auto;
        }
        #qr-reader {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
        }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="main-container">
        <h1>Store <span id="store-num"></span> Check-in</h1>
        <div id="camera-wrapper">
            <div id="qr-reader"></div>
        </div>
        <div id="status"></div>
    </div>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
    const TOTAL_STORES = 56;
    const params = new URLSearchParams(location.search);
    const storeNum = parseInt(params.get('num') || '1', 10);
    document.getElementById('store-num').textContent = storeNum;

    // Update this list with the participant IDs encoded in your QR codes
    const PARTICIPANTS = ['P001','P002','P003'];

    async function updateCheckin(id) {
        const res = await fetch('/checkin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, store: storeNum })
        });
        if (!res.ok) throw new Error('Server error');
        const data = await res.json();
        return data.already;
    }

    function setStatus(msg, ok) {
        const el = document.getElementById('status');
        el.style.color = ok ? 'green' : 'red';
        el.textContent = msg;
    }

    function clearStatus() {
        document.getElementById('status').textContent = '';
    }

    let resumeTimeout = null;
    async function onScanSuccess(decodedText) {
        if (resumeTimeout) return;
        html5QrCode.pause(true);

        let pauseMs = 1000;
        if (PARTICIPANTS.includes(decodedText)) {
            try {
                const already = await updateCheckin(decodedText);
                if (already) {
                    setStatus(`${decodedText} \u4e4b\u524d\u5df2\u7d93\u767b\u9304\u904e`, false);
                    pauseMs = 1000;
                } else {
                    setStatus(`\u53c3\u52a0\u8005${decodedText} \u767b\u9304\u6210\u529f`, true);
                    pauseMs = 3000;
                }
            } catch (e) {
                setStatus('Server error', false);
            }
        } else {
            setStatus('Invalid participant ID', false);
            pauseMs = 1000;
        }
        resumeTimeout = setTimeout(() => {
            clearStatus();
            html5QrCode.resume();
            resumeTimeout = null;
        }, pauseMs);
    }

    const html5QrCode = new Html5Qrcode('qr-reader');
    const config = { fps: 10, qrbox: 200 };

    html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess)
      .catch(err => {
        console.warn('Falling back to default camera', err);
        html5QrCode.start({ facingMode: 'user' }, config, onScanSuccess)
          .catch(err2 => console.error(err2));
      });
    </script>
</body>
</html>
