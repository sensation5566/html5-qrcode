<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store Check-in</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
            background-image: url('img/bg.png');
            background-repeat: no-repeat;
            background-position: top center;
            background-size: auto 100%;
        }
        #main-container {
            width: 100%;
            max-width: 400px;
            padding: 1em;
            box-sizing: border-box;
            text-align: center;
        }
        #camera-wrapper {
            position: relative;
            width: 80%;
            background: url('img/camera.png') no-repeat center center;
            margin: 0 auto; 
            background-size: 76% 100%;
            margin: 0 auto;
            padding-top: 12%;
            padding-right: 3%;
            padding-bottom: 2%;
        }
        #qr-reader {
            width: 70%;
            margin: auto;
        }
        h1 {
            color: #ffffff;
        }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="main-container">
        <p></p>
        <h1>Store <span id="store-num"></span></h1>
        <div id="camera-wrapper">
            <div id="qr-reader"></div>
        </div>
        <div id="status"></div>
    </div>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
    const TOTAL_STORES = 56;
    const params = new URLSearchParams(location.search);
    const storeNum = parseInt(params.get('num') || '1', 10);
    document.getElementById('store-num').textContent = storeNum;

    // Update this list with the participant IDs encoded in your QR codes
    const PARTICIPANTS = ['P001','P002','P003'];

    async function updateCheckin(id) {
        const res = await fetch('/checkin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, store: storeNum })
        });
        if (!res.ok) throw new Error('Server error');
        const data = await res.json();
        return data.already;
    }

    function setStatus(type) {
        const el = document.getElementById('status');
        let src = null;
        if (type === 'ok') src = 'img/code_ok.png';
        else if (type === 'already') src = 'img/code_already.png';
        else if (type === 'invalid') src = 'img/code_invalid.png';
        if (src) {
            el.innerHTML = `<img src="${src}" style="width:80%">`;
        } else {
            el.style.color = 'red';
            el.textContent = type;
        }
    }

    function clearStatus() {
        const el = document.getElementById('status');
        el.textContent = '';
        el.innerHTML = '';
    }

    let resumeTimeout = null;
    async function onScanSuccess(decodedText) {
        if (resumeTimeout) return;
        html5QrCode.pause(true);

        let pauseMs = 1000;
        if (PARTICIPANTS.includes(decodedText)) {
            try {
                const already = await updateCheckin(decodedText);
                if (already) {
                    setStatus('already');
                    pauseMs = 1000;
                } else {
                    setStatus('ok');
                    pauseMs = 3000;
                }
            } catch (e) {
                setStatus('Server error');
            }
        } else {
            setStatus('invalid');
            pauseMs = 1000;
        }
        resumeTimeout = setTimeout(() => {
            clearStatus();
            html5QrCode.resume();
            resumeTimeout = null;
        }, pauseMs);
    }

    const qrboxFunction = function(viewfinderWidth, viewfinderHeight) {
        let minEdgePercentage = 0.7; // 70%
        let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
        let qrboxSize = Math.floor(minEdgeSize * minEdgePercentage);
        return {
            width: qrboxSize,
            height: qrboxSize
        };
    };

    const html5QrCode = new Html5Qrcode('qr-reader');
    const config = { fps: 10, qrbox: qrboxFunction, aspectRatio: 0.75 };

    html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess)
      .catch(err => {
        console.warn('Falling back to default camera', err);
        html5QrCode.start({ facingMode: 'user' }, config, onScanSuccess)
          .catch(err2 => console.error(err2));
      });
    </script>
</body>
</html>
