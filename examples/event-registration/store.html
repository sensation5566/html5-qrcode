<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store Check-in</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 1em; text-align: center; }
        #qr-reader { width: 100%; max-width: 400px; margin: 0 auto; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Store <span id="store-num"></span> Check-in</h1>
    <div id="qr-reader"></div>
    <div id="status"></div>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
    const TOTAL_STORES = 56;
    const params = new URLSearchParams(location.search);
    const storeNum = parseInt(params.get('num') || '1', 10);
    document.getElementById('store-num').textContent = storeNum;

    // Update this list with the participant IDs encoded in your QR codes
    const PARTICIPANTS = ['P001','P002','P003'];

    function updateCheckin(id) {
        let checkins = JSON.parse(localStorage.getItem('checkins') || '{}');
        if (!checkins[id]) {
            checkins[id] = new Array(TOTAL_STORES).fill(false);
        }
        const already = checkins[id][storeNum - 1];
        if (!already) {
            checkins[id][storeNum - 1] = true;
            localStorage.setItem('checkins', JSON.stringify(checkins));
        }
        return already;
    }

    function setStatus(msg, ok) {
        const el = document.getElementById('status');
        el.style.color = ok ? 'green' : 'red';
        el.textContent = msg;
    }

    function clearStatus() {
        document.getElementById('status').textContent = '';
    }

    let resumeTimeout = null;
    function onScanSuccess(decodedText) {
        if (resumeTimeout) return;
        html5QrCode.pause(true);

        let pauseMs = 1000;
        if (PARTICIPANTS.includes(decodedText)) {
            const already = updateCheckin(decodedText);
            if (already) {
                setStatus(`${decodedText} \u4e4b\u524d\u5df2\u7d93\u767b\u9304\u904e`, false);
                pauseMs = 1000;
            } else {
                setStatus(`\u53c3\u52a0\u8005${decodedText} \u767b\u9304\u6210\u529f`, true);
                pauseMs = 3000;
            }
        } else {
            setStatus('Invalid participant ID', false);
            pauseMs = 1000;
        }
        resumeTimeout = setTimeout(() => {
            clearStatus();
            html5QrCode.resume();
            resumeTimeout = null;
        }, pauseMs);
    }

    const html5QrCode = new Html5Qrcode('qr-reader');
    const config = { fps: 10, qrbox: 250 };

    html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess)
      .catch(err => {
        console.warn('Falling back to default camera', err);
        html5QrCode.start({ facingMode: 'user' }, config, onScanSuccess)
          .catch(err2 => console.error(err2));
      });
    </script>
</body>
</html>
